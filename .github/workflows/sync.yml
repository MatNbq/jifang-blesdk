name: Sync from Gitee
on:
  schedule:
    - cron: '*/5 * * * *'      # 每 5 分钟同步一次
  workflow_dispatch:            # 支持手动触发
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Gitee → GitHub
        run: |
          git clone --mirror https://gitee.com/matnbq/xiaodao-blesdk.git repo
          cd repo
          git remote set-url --push origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push --mirror --force
